# Produção: docker compose -f docker-compose.prod.yml up -d --build
# Requer .env no servidor — ver docs/runbook.md
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-contentpilot}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-contentpilot}
  AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
  AUTH_URL: https://${DOMAIN:?defina DOMAIN no .env}
  AUTH_TRUST_HOST: "true"
  ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
  VAULT_MASTER_KEYS: ${VAULT_MASTER_KEYS:?defina VAULT_MASTER_KEYS no .env}
  VAULT_ACTIVE_KEY_ID: ${VAULT_ACTIVE_KEY_ID:-k1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  # Vazios = recuperação de senha inativa. Podem ser definidos em /admin/settings.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  BILLING_ENABLED: ${BILLING_ENABLED:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contentpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-contentpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contentpilot} -d ${POSTGRES_DB:-contentpilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
